services:
  app:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    command:
      - sh
      - -ec
      - |
        pip install --no-cache-dir -r requirements.txt
        exec streamlit run streamlit_app.py \
          --server.port 3000 \
          --server.address 0.0.0.0 \
          --server.enableXsrfProtection false \
          --server.enableCORS true \
          --server.headless true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/_stcore/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: on-failure
